<!DOCTYPE html>
<html>
<head>
    <title>Dating website</title>
    <style>
        body {
            font-family: Verdana, Arial, sans-serif;
        }

        p{
            margin: 0;
        }
legend{
    background-color: purple;
    border-radius: 10px;
    color: white;
    padding: 12px;
    }
    fieldset{
        background: lavender;
        border: 10px solid darkblue;
        border-radius: 20px;
        margin-bottom: 10px;
        width: 720px;
    }
    div{
        margin: 10px;
    }
    label{
        display: inline-block;
        text-align: right;
        vertical-align: top;
        width: 200px;
    }
    input[type="radio"]+label, input[type="checkbox"]+label{
        width: auto;
    }
    .range-caption{
        background: darkcyan;
        color: white;
        padding: 6px;
        text-align: center;

    }
   [type="submit"]{
        background: darkcyan;
        border-radius: 10px;
        color: white;
        font-size: 20px;
        padding: 12px;
    }
    div:hover{
color: blue;
    }
    </style>
</head>
<body>
    <h1>Enter Your Details For Our Website</h1>
    <form action="https://us-central1-nucamp-production.cloudfunctions.net/post/formdata" method="post" enctype="multipart/form-data">
        <fieldset>
            <legend>Your Face</legend>
    <div>
             <label for="avatar">Upload Your Image</label>   
            <input type="file" id="avatar" name="avatar" required>
           </div>
            <p>Image preview: <img id="preview" width="500"></p>
        </fieldset>
        <fieldset>
            <legend>Your Details</legend>
            <div>
                <label for="Name">Name</label>
            <input type="text" id="Name" placeholder="Your Full Name">
            </div>
            <div>
<label>Gender:</label>
<input type="radio" id="man" name="gender" value="male" required/> 
<label for="man">Man</label>
<input type="radio" id="woman" name="gender" value="woman" required/>
<label for="woman">Woman</label>
            </div>
            <div>
                <label for="age">Age (years):</label>
                <input type="number" id="age" min="18" max="99" name="age" required/>
            </div>
            <div>
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob"/>
            </div>
            <div>
                <label for="Color">Favorite Color:</label>
                <input type="color" id="color" name="color"/>
                </div>
                <div>
                    <label for="country">Country:</label>
                    <select id="country" name="country">
                    <option value=""> Choose a country: </option>
                    <option value="brazil">Brazil</option>
                    <option value="usa">USA</option>
                    <option value="france">France</option>
                    <option value="japan">Japan</option>
                    <option value="lybia">Lybia</Option>
            </select>
                </div>
                <div>
                    <label for="salary">Salary</label>
                    <span class="range-caption">Poor</span>
                    <input type="range" id="salary" name="salary" min="0" max="100" value="50"/>
                    <span class="range-caption">Rich</span>
                </div>
                <Fieldset>
                    <Legend>Your Contact Information</Legend>
                    <div>
                        <Label For="email">Email:</Label>
                        <Input Type="email" Id="email" Placeholder="you@example.com" Required />
                    </div>
                    <div>
                        <Label For="Phone">Phone:</Label>
                        <Input Type="tel" Id="phone" name="phone"/>
                    </div>
                    <div>
                        <Label For="address">Address:</Label>
                        <textarea name="address" id="address" cols="40"></textarea>
                    </div>
                    <div>
                        <label>Contact method(s)</label>
                        <input type="checkbox" name="contact" id="emailCheckbox" value="email">
                        <label for="emailCheckbox">Email</label>
                        <input type="checkbox" name="contact"  id="phoneCheckbox" value="phone">
                        <label for="phonecheckbox">Phone</label>
                    </div>
                </Fieldset>
        </fieldset>
        <div>
            <input type="submit">
        </div>
    </form>
    <script src="https://url.nucamp.co/datingjs"></script>
</body>
</html>
